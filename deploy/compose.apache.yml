# Merge into the existing apache service, keeping its data volumes and network.
# All source paths refer to the Docker host.
# Keep the existing Apache image. Create/chown the storyboard host directory to
# 33:33 before starting the worker (see README), then merge its service below.
services:
  apache:
    command:
      - /bin/sh
      - -ec
      - |
        a2enmod rewrite
        apache2ctl -t
        exec apache2-foreground
    environment:
      H5AI_STORYBOARD_WORKER: external
      H5AI_AUTH_FILE: /run/secrets/h5ai.htpasswd
      H5AI_HTTPS: "1"
      H5AI_USERS_DIR: /var/lib/h5ai/users
      H5AI_AUTH_STATE: /var/lib/h5ai/users/login-attempts
      # Optional: replace with the actual Traefik IP on the shared network.
      # H5AI_TRUSTED_PROXIES: "172.21.0.2"
      H5AI_ADMIN_USER: ton_identifiant
    volumes:
      - /docker/apache2/auth/users.htpasswd:/run/secrets/h5ai.htpasswd:ro
      - /docker/apache2/auth/managed:/var/lib/h5ai/users:rw
      - /docker/apache2/website/_h5ai/deploy/apache-h5ai.conf:/etc/apache2/sites-available/000-default.conf:ro
      - /docker/apache2/website/_h5ai/deploy/auth.ini:/usr/local/etc/php/conf.d/h5ai-auth.ini:ro
    labels:
      - traefik.http.routers.apache.middlewares=apache-force-https
      - traefik.http.middlewares.apache-force-https.redirectscheme.scheme=https
      - traefik.http.middlewares.apache-force-https.redirectscheme.permanent=true

  storyboards:
    image: h5ai-storyboards:local
    build:
      context: /docker/apache2/website/_h5ai/deploy
      dockerfile: Dockerfile
      args:
        PHP_IMAGE: php:8.5.12-cli
    restart: unless-stopped
    # Independent from Apache: no depends_on, health gate or shared process.
    # Bound decoder failures so they do not exhaust the host's RAM/processes.
    cpus: 1.0
    mem_limit: 2g
    memswap_limit: 2g
    pids_limit: 256
    oom_score_adj: 500
    init: true
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      H5AI_USERS_DIR: /var/lib/h5ai/users
      H5AI_STORYBOARD_WORKER: external
      H5AI_STORYBOARD_CONCURRENCY: "10"
    volumes:
      # Mirror ALL Apache video mounts at identical container paths, read-only.
      - /docker/apache2/website:/var/www/html:ro
      # Example if Apache also mounts an external media folder:
      # - /srv/partage/Documents:/var/www/html/Documents:ro
      - /docker/apache2/auth/managed/storyboards:/var/lib/h5ai/users/storyboards:rw
