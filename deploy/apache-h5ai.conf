# Mount as /etc/apache2/sites-enabled/000-default.conf in php:*-apache.
# Requires mod_rewrite (see Dockerfile). This vhost owns the entire shared root.
<VirtualHost *:80>
    DocumentRoot /var/www/html
    AllowEncodedSlashes Off
    # All authorization must pass through PHP, including existing files and dirs.
    # Only application assets below these fixed directories bypass PHP.
    RewriteEngine On
    RewriteRule ^/?_h5ai/public/(css|js|images|fonts)/[a-zA-Z0-9_./-]+\.(css|js|png|jpe?g|gif|webp|ico|svg|woff2?|ttf|eot)$ - [END]
    RewriteRule ^/?_h5ai/public/index\.php$ - [END]
    RewriteRule ^ /_h5ai/public/index.php [END]

    <Directory /var/www/html>
        AllowOverride None
        Options -Indexes -Includes -ExecCGI -MultiViews -FollowSymLinks
        Require all granted
        DirectoryIndex disabled
        # Shared PHP files are neither executable endpoints nor source downloads.
        <FilesMatch "(?i)\.(php[0-9]?|phtml|phar)$">
            Require all denied
        </FilesMatch>
    </Directory>
    <Directory /var/www/html/_h5ai/public>
        <Files "index.php">
            Require all granted
        </Files>
    </Directory>
    <Directory /var/www/html/_h5ai/private>
        Require all denied
    </Directory>
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
