# Mount as /etc/apache2/sites-available/000-default.conf in php:*-apache.
# Requires mod_rewrite (enabled by compose.apache.yml).
<VirtualHost *:80>
    DocumentRoot /var/www/html
    AllowEncodedSlashes Off

    # Only fixed application assets bypass the authenticated PHP gateway.
    RewriteEngine On
    RewriteRule ^/?_h5ai/public/js/jassub/[a-zA-Z0-9_-]+\.wasm$ - [END]
    RewriteRule ^/?_h5ai/public/(css|js|images|fonts)/[a-zA-Z0-9_./-]+\.(css|js|png|jpe?g|gif|webp|ico|svg|woff2?|ttf|eot)$ - [END]
    RewriteRule ^/?_h5ai/public/index\.php$ - [END]
    RewriteRule ^ /_h5ai/public/index.php [END]

    <Directory /var/www/html>
        AllowOverride None
        Options -Indexes -Includes -ExecCGI -MultiViews -FollowSymLinks
        Require all granted
        DirectoryIndex disabled
        <FilesMatch "(?i)\.(php[0-9]?|phtml|phar)$">
            Require all denied
        </FilesMatch>
    </Directory>
    <Directory /var/www/html/_h5ai/public>
        AddType application/wasm .wasm
        <Files "index.php">
            Require all granted
        </Files>
    </Directory>
    <Directory /var/www/html/_h5ai/private>
        Require all denied
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
